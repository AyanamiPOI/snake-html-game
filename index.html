<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake mit Touch</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101010;
      color: #fff;
      font-family: system-ui, sans-serif;
      touch-action: none;
    }

    .wrap {
      text-align: center;
      width: min(92vw, 620px);
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    canvas {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 1;
      background: #1a1a1a;
      border: 2px solid #3a3a3a;
      image-rendering: pixelated;
      border-radius: 8px;
    }

    .info {
      margin-top: 10px;
      opacity: 0.95;
      font-size: 14px;
      line-height: 1.5;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      gap: 8px;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    button {
      width: 70px;
      height: 54px;
      border: 1px solid #4b4b4b;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .action-button {
      width: auto;
      min-width: 104px;
      height: 42px;
      padding: 0 14px;
      font-size: 15px;
    }

    button:active {
      transform: scale(0.97);
      background: #2d2d2d;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>🐍 Snake</h1>
    <canvas id="game" width="560" height="560" aria-label="Snake Spielfeld"></canvas>
    <div class="info">
      Tastatur: Pfeiltasten / WASD · Pause: P oder Leertaste · Neustart: R<br />
      Touch: Buttons nutzen oder auf dem Spielfeld wischen
      <div class="stats" aria-live="polite">
        <span>Score: <strong id="score">0</strong></span>
        <span>Bestwert: <strong id="highScore">0</strong></span>
      </div>
      <div class="actions">
        <button id="pauseButton" class="action-button" type="button">Pause</button>
        <button id="restartButton" class="action-button" type="button">Neustart</button>
        <button id="autoPlayButton" class="action-button" type="button">Autoplay</button>
      </div>
    </div>

    <div class="controls" aria-label="Touch Steuerung">
      <div class="row">
        <button type="button" data-dir="up" aria-label="Hoch">▲</button>
      </div>
      <div class="row">
        <button type="button" data-dir="left" aria-label="Links">◀</button>
        <button type="button" data-dir="down" aria-label="Runter">▼</button>
        <button type="button" data-dir="right" aria-label="Rechts">▶</button>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const pauseButton = document.getElementById("pauseButton");
    const restartButton = document.getElementById("restartButton");
    const autoPlayButton = document.getElementById("autoPlayButton");

    const gridSize = 21;
    const tileSize = canvas.width / gridSize;
    const highScoreKey = "snakeHighScore";
    const directions = [
      { name: "up", vector: { x: 0, y: -1 } },
      { name: "down", vector: { x: 0, y: 1 } },
      { name: "left", vector: { x: -1, y: 0 } },
      { name: "right", vector: { x: 1, y: 0 } },
    ];

    let snake;
    let dir;
    let nextDir;
    let food;
    let score;
    let highScore;
    let gameOver;
    let gameWon;
    let isPaused;
    let isAutoPlaying;
    let tickMs;

    function readHighScore() {
      try {
        return Number(localStorage.getItem(highScoreKey)) || 0;
      } catch {
        return 0;
      }
    }

    function saveHighScore(value) {
      try {
        localStorage.setItem(highScoreKey, String(value));
      } catch {
        // Highscore ist optional, falls der Browser lokalen Speicher blockiert.
      }
    }

    function updateScoreDisplay() {
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
    }

    function updateAutoPlayButton() {
      autoPlayButton.textContent = isAutoPlaying ? "Autoplay aus" : "Autoplay";
    }

    function reset() {
      snake = [{ x: 10, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      highScore = readHighScore();
      gameOver = false;
      gameWon = false;
      isPaused = false;
      isAutoPlaying = false;
      tickMs = 120;
      pauseButton.textContent = "Pause";
      updateAutoPlayButton();
      updateScoreDisplay();
      placeFood();
    }

    function samePosition(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function positionKey(position) {
      return `${position.x},${position.y}`;
    }

    function isInsideBoard(position) {
      return (
        position.x >= 0 &&
        position.x < gridSize &&
        position.y >= 0 &&
        position.y < gridSize
      );
    }

    function getNextPosition(position, vector) {
      return { x: position.x + vector.x, y: position.y + vector.y };
    }

    function getManhattanDistance(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function isReverseMove(vector, currentDirection) {
      return vector.x === -currentDirection.x && vector.y === -currentDirection.y;
    }

    function simulateMove(testSnake, vector, testFood) {
      const newHead = getNextPosition(testSnake[0], vector);

      if (!isInsideBoard(newHead)) {
        return null;
      }

      const eatsFood = Boolean(testFood && samePosition(newHead, testFood));
      const collisionSegments = eatsFood ? testSnake : testSnake.slice(0, -1);
      const bodyHit = collisionSegments.some((segment) => samePosition(segment, newHead));

      if (bodyHit) {
        return null;
      }

      const movedSnake = [newHead, ...testSnake];
      if (!eatsFood) {
        movedSnake.pop();
      }

      return { snake: movedSnake, ateFood: eatsFood };
    }

    function countReachableTiles(start, testSnake) {
      const blocked = new Set(testSnake.slice(1).map(positionKey));
      const visited = new Set([positionKey(start)]);
      const queue = [start];
      let count = 0;

      while (queue.length > 0) {
        const current = queue.shift();
        count += 1;

        directions.forEach(({ vector }) => {
          const next = getNextPosition(current, vector);
          const key = positionKey(next);

          if (
            isInsideBoard(next) &&
            !blocked.has(key) &&
            !visited.has(key)
          ) {
            visited.add(key);
            queue.push(next);
          }
        });
      }

      return count;
    }

    function findPathToFood(testSnake, currentDirection, targetFood) {
      if (!targetFood) {
        return [];
      }

      const start = testSnake[0];
      const blocked = new Set(testSnake.slice(1).map(positionKey));
      const queue = [{ position: start, path: [], direction: currentDirection }];
      const visited = new Set([positionKey(start)]);

      while (queue.length > 0) {
        const current = queue.shift();

        if (samePosition(current.position, targetFood)) {
          return current.path;
        }

        directions.forEach((option) => {
          if (
            current.path.length === 0 &&
            isReverseMove(option.vector, current.direction)
          ) {
            return;
          }

          const next = getNextPosition(current.position, option.vector);
          const key = positionKey(next);

          if (
            isInsideBoard(next) &&
            !blocked.has(key) &&
            !visited.has(key)
          ) {
            visited.add(key);
            queue.push({
              position: next,
              path: [...current.path, option.name],
              direction: option.vector,
            });
          }
        });
      }

      return [];
    }

    function scoreAutoPlayMove(option) {
      const simulation = simulateMove(snake, option.vector, food);
      if (!simulation) {
        return null;
      }

      const simulatedHead = simulation.snake[0];
      const reachableTiles = countReachableTiles(simulatedHead, simulation.snake);
      const pathAfterMove = simulation.ateFood
        ? []
        : findPathToFood(simulation.snake, option.vector, food);
      const canReachFood = simulation.ateFood || pathAfterMove.length > 0;
      const minimumSafeSpace = Math.min(gridSize * gridSize, simulation.snake.length + 5);
      const hasEnoughSpace = reachableTiles >= minimumSafeSpace;
      const distanceToFood = food ? getManhattanDistance(simulatedHead, food) : 0;

      return {
        ...option,
        simulation,
        reachableTiles,
        canReachFood,
        hasEnoughSpace,
        pathLength: simulation.ateFood ? 0 : pathAfterMove.length || Number.POSITIVE_INFINITY,
        distanceToFood,
      };
    }

    function chooseAutoPlayDirection() {
      if (!food) {
        return;
      }

      const rankedMoves = directions
        .filter((option) => !isReverseMove(option.vector, dir))
        .map(scoreAutoPlayMove)
        .filter(Boolean)
        .sort((a, b) => {
          if (a.hasEnoughSpace !== b.hasEnoughSpace) return b.hasEnoughSpace - a.hasEnoughSpace;
          if (a.canReachFood !== b.canReachFood) return b.canReachFood - a.canReachFood;
          if (a.pathLength !== b.pathLength) return a.pathLength - b.pathLength;
          if (a.reachableTiles !== b.reachableTiles) return b.reachableTiles - a.reachableTiles;
          return a.distanceToFood - b.distanceToFood;
        });

      if (rankedMoves.length > 0) {
        nextDir = { ...rankedMoves[0].vector };
      }
    }

    function placeFood() {
      const emptyTiles = [];

      for (let y = 0; y < gridSize; y += 1) {
        for (let x = 0; x < gridSize; x += 1) {
          const snakeOnTile = snake.some((segment) => segment.x === x && segment.y === y);

          if (!snakeOnTile) {
            emptyTiles.push({ x, y });
          }
        }
      }

      if (emptyTiles.length === 0) {
        food = null;
        gameWon = true;
        return;
      }

      food = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
    }

    function setDirection(direction) {
      if (direction === "up" && dir.y !== 1) nextDir = { x: 0, y: -1 };
      if (direction === "down" && dir.y !== -1) nextDir = { x: 0, y: 1 };
      if (direction === "left" && dir.x !== 1) nextDir = { x: -1, y: 0 };
      if (direction === "right" && dir.x !== -1) nextDir = { x: 1, y: 0 };
    }

    function togglePause() {
      if (gameOver || gameWon) {
        return;
      }

      isPaused = !isPaused;
      pauseButton.textContent = isPaused ? "Weiter" : "Pause";
    }

    function toggleAutoPlay() {
      if (gameOver || gameWon) {
        return;
      }

      isAutoPlaying = !isAutoPlaying;
      if (isAutoPlaying && isPaused) {
        isPaused = false;
        pauseButton.textContent = "Pause";
      }
      updateAutoPlayButton();
    }

    function update() {
      if (gameOver || gameWon || isPaused) {
        return;
      }

      if (isAutoPlaying) {
        chooseAutoPlayDirection();
      }

      dir = nextDir;
      const simulation = simulateMove(snake, dir, food);

      if (!simulation) {
        gameOver = true;
        return;
      }

      snake = simulation.snake;

      if (simulation.ateFood) {
        score += 1;
        tickMs = Math.max(65, tickMs - 2);

        if (score > highScore) {
          highScore = score;
          saveHighScore(highScore);
        }

        updateScoreDisplay();
        placeFood();
      }
    }

    function drawGrid() {
      ctx.strokeStyle = "#242424";
      for (let i = 0; i <= gridSize; i += 1) {
        const p = i * tileSize;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.62)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 34px sans-serif";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "16px sans-serif";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 22);
    }

    function draw() {
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();

      if (food) {
        ctx.fillStyle = "#ff4d4d";
        ctx.fillRect(
          food.x * tileSize + 2,
          food.y * tileSize + 2,
          tileSize - 4,
          tileSize - 4,
        );
      }

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#87ff39" : "#40d553";
        ctx.fillRect(
          segment.x * tileSize + 1,
          segment.y * tileSize + 1,
          tileSize - 2,
          tileSize - 2,
        );
      });

      if (isAutoPlaying && !isPaused && !gameOver && !gameWon) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.44)";
        ctx.fillRect(12, 12, 118, 32);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "left";
        ctx.font = "16px sans-serif";
        ctx.fillText("Autoplay", 24, 34);
      }

      if (isPaused) {
        drawOverlay("Pause", "P, Leertaste oder Weiter drücken");
      }

      if (gameOver) {
        drawOverlay("Game Over", "R oder Neustart drücken");
      }

      if (gameWon) {
        drawOverlay("Gewonnen!", "R oder Neustart drücken");
      }
    }

    function gameLoop() {
      update();
      draw();
      setTimeout(() => requestAnimationFrame(gameLoop), tickMs);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
        event.preventDefault();
      }

      if (key === "r") {
        reset();
        return;
      }

      if (key === "p" || event.key === " ") {
        togglePause();
        return;
      }

      if (key === "arrowup" || key === "w") setDirection("up");
      if (key === "arrowdown" || key === "s") setDirection("down");
      if (key === "arrowleft" || key === "a") setDirection("left");
      if (key === "arrowright" || key === "d") setDirection("right");
    });

    pauseButton.addEventListener("click", togglePause);
    restartButton.addEventListener("click", reset);
    autoPlayButton.addEventListener("click", toggleAutoPlay);

    document.querySelectorAll("button[data-dir]").forEach((button) => {
      const direction = button.dataset.dir;
      const handler = (event) => {
        event.preventDefault();
        setDirection(direction);
      };
      button.addEventListener("click", handler);
      button.addEventListener("touchstart", handler, { passive: false });
    });

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener(
      "touchstart",
      (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      },
      { passive: true },
    );

    canvas.addEventListener(
      "touchend",
      (event) => {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        const minSwipe = 22;

        if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) {
          return;
        }

        if (Math.abs(dx) > Math.abs(dy)) {
          setDirection(dx > 0 ? "right" : "left");
        } else {
          setDirection(dy > 0 ? "down" : "up");
        }
      },
      { passive: true },
    );

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && !gameOver && !gameWon && !isPaused) {
        togglePause();
      }
    });

    reset();
    gameLoop();
  </script>
</body>
</html>
